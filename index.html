<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tareas de Recepción (versión local)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: tablero de trabajo, claro y alegre, como un work OS
   IDEA: el board de monday: grupos por bloque horario, celdas de estado de color lleno
   PICTURE: la tabla del día con sus pills de color; kanban y panel de tarea como vistas
   COLOUR and TYPE: superficie blanca sobre gris azulado claro; verde/naranja/rojo/gris de estado; Figtree
   LAYOUT: barra superior, pestañas de vistas, tablero a lo ancho, panel lateral de tarea */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#15171c);--panel:light-dark(#fff,#1f2229);--ink:light-dark(#2b2f38,#e6e8ee);--mute:light-dark(#676d7a,#9aa0ad);
--line:light-dark(#e3e6ec,#323641);--hover:light-dark(#f5f6fa,#262a33);--brand:light-dark(#3b5bdb,#7d95f0);
--pend:light-dark(#c4c8d0,#4a4f5b);--run:#fdab3d;--done:#00b86b;--stuck:#e2445c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:16px max(3vw,14px) 0}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;max-width:1320px;margin:auto}
h1{font-size:clamp(22px,3vw,30px);line-height:1.1;margin:0;font-weight:700}
h1 small{display:block;font-size:14px;font-weight:400;color:var(--mute);margin-top:4px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.ctl label{display:grid;gap:2px;font-size:12px;color:var(--mute)}
input,select,textarea{font-size:16px;border:1px solid var(--line);border-radius:6px;background:var(--panel);min-height:40px;padding:6px 10px}
.btn{min-height:40px;padding:0 16px;border-radius:6px;border:0;background:var(--brand);color:#fff;cursor:pointer;font-weight:600}
.btn.lite{background:var(--hover);color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--stuck)}
nav{display:flex;gap:2px;max-width:1320px;margin:12px auto 0;overflow-x:auto}
nav a{flex:none;color:var(--mute);text-decoration:none;padding:10px 14px;font-weight:500;border-bottom:3px solid transparent}
nav a.on{color:var(--ink);border-bottom-color:var(--brand)}
main{max-width:1320px;margin:auto;padding:20px max(3vw,14px) 64px}
.msg{background:var(--stuck);color:#fff;padding:10px 14px;border-radius:8px;margin-bottom:14px}
.alert{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--run);padding:10px 14px;border-radius:8px;margin-bottom:12px}
.alert.ok{border-left-color:var(--done)}.alert b{font-weight:600}
.empty{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px;color:var(--mute)}
.empty h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.head{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;margin-bottom:16px}
.head h2{margin:0;font-size:22px}
.batt{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--pend);flex:1 1 260px;max-width:460px}
.batt i{display:block;height:100%}.batt i.s-w{background:var(--run)}.batt i.s-d{background:var(--done)}.batt i.s-b{background:var(--stuck)}.batt i.s-p{background:var(--pend)}
.kp{display:flex;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:14px}.kp b{color:var(--ink);font-size:17px;margin-right:3px}.kp .bad b{color:var(--stuck)}
.group{margin-bottom:22px}
.gh{display:flex;align-items:baseline;gap:10px;margin:0 0 6px;font-size:18px;font-weight:700;color:var(--g)}
.gh small{color:var(--mute);font-weight:400;font-size:13px}
.gh .now{background:var(--g);color:#fff;font-size:12px;padding:2px 8px;border-radius:99px;font-weight:600}
.board{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:visible}
.row{display:grid;grid-template-columns:6px minmax(180px,2.2fr) 120px 150px 96px minmax(140px,2fr) 92px;align-items:stretch;border-bottom:1px solid var(--line);min-height:44px}
.row:last-child{border-bottom:0}.row.hd{min-height:34px;color:var(--mute);font-size:13px}.row.hd>div{padding:8px 10px;align-items:center}
.row:not(.hd):hover{background:var(--hover)}
.row>div{display:flex;align-items:center;padding:4px 10px;border-left:1px solid var(--line)}
.row>.bar,.row.hd>.bar{background:var(--g);padding:0;border-left:0}.row>.nm{border-left:0;gap:8px;font-weight:500}
.row>.nm .flag{font-size:12px;font-weight:700;color:var(--stuck);white-space:nowrap}
.row>.nm .wait{font-size:12px;font-weight:600;color:var(--run);white-space:nowrap}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--hover);color:var(--mute);white-space:nowrap;border:1px solid var(--line)}
.tag.x{color:var(--brand);border-color:var(--brand)}
.stc{position:relative;padding:0!important}
.pill{width:100%;height:100%;min-height:44px;border:0;cursor:pointer;color:#fff;font-weight:600;font-size:14px;background:var(--pend)}
.pill.s-p{color:var(--ink)}.pill.s-w{background:var(--run)}.pill.s-d{background:var(--done)}.pill.s-b{background:var(--stuck)}
.pill:disabled{cursor:default}.pill.late{box-shadow:inset 0 0 0 2px var(--stuck)}.pill.late.s-p{background:color-mix(in srgb,var(--stuck) 14%,var(--panel));color:var(--stuck)}
.pop{position:absolute;z-index:20;top:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:6px;width:170px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.pop button{min-height:38px;border:0;border-radius:4px;color:#fff;font-weight:600;cursor:pointer}
.pop .s-p{background:var(--pend);color:var(--ink)}.pop .s-w{background:var(--run)}.pop .s-d{background:var(--done)}.pop .s-b{background:var(--stuck)}
.cell input{border:1px solid transparent;background:transparent;width:100%;min-height:36px}
.cell input:hover,.cell input:focus{border-color:var(--line);background:var(--panel)}
.link{background:none;border:0;color:var(--brand);cursor:pointer;padding:6px 0;font-weight:500;text-decoration:underline}
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.35);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);z-index:31;overflow-y:auto;padding:22px 24px 40px;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.drawer h2{margin:0 0 6px;font-size:24px;line-height:1.15}
.drawer .x{float:right;min-width:44px;min-height:44px;border:0;background:var(--hover);border-radius:8px;cursor:pointer;font-size:20px}
.drawer .meta{color:var(--mute);margin-bottom:14px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0}
.seg button{min-height:44px;border-radius:6px;border:2px solid transparent;cursor:pointer;font-weight:600;color:#fff}
.seg .s-p{background:var(--pend);color:var(--ink)}.seg .s-w{background:var(--run)}.seg .s-d{background:var(--done)}.seg .s-b{background:var(--stuck)}
.seg button:not(.on){opacity:.45}.seg button.on{border-color:var(--ink)}
.drawer label{display:grid;gap:4px;font-size:13px;color:var(--mute);margin-top:10px}
.drawer textarea{min-height:90px;resize:vertical}
.warn{border-left:4px solid var(--stuck);background:color-mix(in srgb,var(--stuck) 9%,transparent);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:14px}
.warn ul{margin:4px 0 0;padding-left:18px}
.steps{margin:8px 0 0;padding-left:22px}.steps li{margin:5px 0}
h3.sub{font-size:15px;margin:20px 0 4px}
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--hover);border:1px solid var(--line);border-radius:8px;min-height:200px}
.col h3{margin:0;padding:10px 12px;color:#fff;border-radius:8px 8px 0 0;font-size:15px;display:flex;justify-content:space-between}
.col.s-p h3{background:var(--pend);color:var(--ink)}.col.s-w h3{background:var(--run)}.col.s-d h3{background:var(--done)}.col.s-b h3{background:var(--stuck)}
.col.over{outline:2px dashed var(--brand)}
.cards{display:grid;gap:8px;padding:10px}
.kc{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--g);border-radius:6px;padding:10px;cursor:grab;text-align:left;width:100%}
.kc b{display:block;font-weight:600}.kc small{color:var(--mute)}.kc .flag{color:var(--stuck);font-weight:700;font-size:12px}
.widgets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.w{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.w b{display:block;font-size:clamp(26px,3.6vw,36px);line-height:1.1}.w.bad b{color:var(--stuck)}.w span{color:var(--mute);font-size:14px}
.w.wide{grid-column:span 2}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mute);margin-top:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:middle;font-size:14px}
thead th{font-weight:500;color:var(--mute);white-space:nowrap}
td.off{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--hover) 6px 12px)}th.now{color:var(--brand)}
.who{background:none;border:0;padding:0;font-weight:600;cursor:pointer;text-align:left;white-space:nowrap}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 5px;border-radius:3px;margin:1px;background:var(--pend);white-space:nowrap}
.chip.s-w{background:var(--run);color:#fff}.chip.s-d{background:var(--done);color:#fff}.chip.s-b,.chip.late{background:var(--stuck);color:#fff}
.mb{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--pend);width:120px}.mb i{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-top:16px}
.card h2{margin:0 0 8px;font-size:18px}
.issues{list-style:none;padding:0;margin:0}.issues li{padding:8px 0;border-bottom:1px solid var(--line)}.issues li:last-child{border:0}
.fm{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.fm label{display:grid;gap:3px;font-size:13px;color:var(--mute)}
.trow{display:grid;grid-template-columns:70px minmax(0,1fr) 220px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.trow .hh{font-size:20px;font-weight:700}.trow .chip{font-size:13px;padding:4px 8px;background:var(--hover);border:1px solid var(--line)}
.chip button{border:0;background:none;padding:0 0 0 6px;cursor:pointer;color:var(--stuck);font-weight:700}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cat article{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--g);border-radius:8px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.cat h3{margin:0;font-size:16px}.cat p{margin:0;font-size:14px;color:var(--mute)}
.recipes{display:grid;gap:10px}
.rec{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.rec p{margin:0;font-size:16px}.rec .k{font-weight:700;color:var(--brand)}.rec small{display:block;color:var(--mute);margin-top:4px}
.sw{position:relative;width:52px;height:30px;border-radius:99px;border:0;background:var(--pend);cursor:pointer}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw[aria-checked=true]{background:var(--done)}.sw[aria-checked=true]::after{left:26px}.sw:disabled{opacity:.5;cursor:default}
.note{color:var(--mute);font-size:14px;margin:0 0 12px}
pre{background:var(--hover);padding:14px;border-radius:8px;white-space:pre-wrap;font:14px/1.5 Figtree,sans-serif;margin:0 0 10px}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;flex:none;background:var(--a)}
.who2{display:flex;align-items:center;gap:8px;white-space:nowrap}
.dash{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.wc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.wc h3{margin:0 0 10px;font-size:15px;font-weight:600}.wc .big{font-size:clamp(30px,4vw,42px);font-weight:700;line-height:1.05}
.wc .big.bad{color:var(--stuck)}.wc .sub{color:var(--mute);font-size:14px}
.wc.span2{grid-column:span 2}.wc.span4{grid-column:1/-1}
.donut{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.prow{display:grid;grid-template-columns:150px minmax(0,1fr) 54px;gap:10px;align-items:center;padding:5px 0}
.pbar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--pend)}.pbar i{display:block;height:100%}
.fig{position:relative;height:220px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chips button{min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.brow{display:grid;grid-template-columns:6px minmax(170px,2fr) 170px 70px 150px minmax(120px,1.6fr);align-items:stretch;border-bottom:1px solid var(--line);min-height:44px}
.brow:last-child{border-bottom:0}.brow.hd{min-height:34px;color:var(--mute);font-size:13px}
.brow>div{display:flex;align-items:center;padding:4px 10px;border-left:1px solid var(--line);gap:8px}
.brow>.bar{background:var(--g);padding:0;border-left:0}.brow>.nm{border-left:0;font-weight:500;cursor:pointer}
.brow:not(.hd):hover{background:var(--hover)}
.tkey{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tkey button{min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600}
.tkey button.on{border-color:var(--brand);color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--done);color:#fff;margin-left:6px}
.banner{background:color-mix(in srgb,var(--brand) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--brand) 30%,var(--line));border-radius:8px;padding:12px 14px;margin-bottom:14px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px;align-content:space-between;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.rcard .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand)}
.rcard p{margin:0;font-size:16px;line-height:1.5;text-align:center}.rcard u{text-decoration-color:var(--brand);text-decoration-thickness:2px;text-underline-offset:3px;font-weight:600}
.rcard .ft{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;color:var(--mute);font-size:14px}
@media(max-width:860px){.widgets{grid-template-columns:repeat(2,minmax(0,1fr))}.kan{grid-template-columns:repeat(2,minmax(0,1fr))}.dash{grid-template-columns:repeat(2,minmax(0,1fr))}.wc.span2{grid-column:1/-1}}
@media(max-width:700px){.brow.hd{display:none}.brow{grid-template-columns:6px minmax(0,1fr) 120px;grid-template-areas:"b n s" "b w s" "b t t"}.brow>.bar{grid-area:b}.brow>.nm{grid-area:n}.brow>.ow{grid-area:w;border-left:0}.brow>.hr2{display:none}.brow>.stc{grid-area:s}.brow>.nt{grid-area:t;border-left:0}.prow{grid-template-columns:110px minmax(0,1fr) 44px}}
@media(max-width:700px){
.row.hd{display:none}.row{grid-template-columns:6px minmax(0,1fr) 130px;grid-template-areas:"b n s" "b q s" "b t t";min-height:0}
.row>.bar{grid-area:b}.row>.nm{grid-area:n;padding-top:10px}.row>.stc{grid-area:s;border-left:1px solid var(--line)}.row>.ty{display:none}
.row>.qty{grid-area:q;border-left:0}.row>.nt{grid-area:t;border-left:0}.row>.go{display:none}.row>.nm{cursor:pointer}
.trow{grid-template-columns:56px minmax(0,1fr)}.trow select{grid-column:2}.rec{grid-template-columns:1fr}}
@media(max-width:520px){.kan{grid-template-columns:1fr}.w.wide{grid-column:span 2}}
@media(prefers-reduced-motion:reduce){.sw::after{transition:none}}
</style>
</head>

 const a=b.dataset.act,pk=b.dataset.pk;
 if(a==='pop'){const key=pk+'|'+b.dataset.k;S.pop=S.pop===key?'':key;render(true);}
 else if(a==='st'){setStatus(pk,b.dataset.k,b.dataset.s);}
 else if(a==='open'){S.drawer={pk,k:b.dataset.k};S.drawerMsg='';render(true);}
 else if(a==='opencat'){S.drawer={cat:b.dataset.t};S.drawerMsg='';render(true);}
 else if(a==='close'){S.drawer=null;S.drawerMsg='';render(true);}
 else if(a==='today'){S.date=nowTZ().date;if(db)subDay();render(true);}
 else if(a==='see'){S.me=pk;lsSet('rec.me',pk);location.hash='#mi';}
 else if(a==='copy'){const t=$('#cierre').textContent;navigator.clipboard.writeText(t).then(()=>{b.textContent='Copiado';setTimeout(()=>b.textContent='Copiar cierre',1800)}).catch(()=>{const r=document.createRange();r.selectNodeContents($('#cierre'));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Seleccionado: usá Ctrl+C';});}
 else if(a==='auto'){const k=b.dataset.a;setPatch({auto:{[k]:!auto(k)}});}
 else if(a==='bf'){S.bf=b.dataset.f;render(true);}
 else if(a==='tplkey'){S.tplKey=b.dataset.key;S.confirmAct=false;S.confirmDel='';render(true);}
 else if(a==='activate'){if(!S.confirmAct){S.confirmAct=true;render(true);return;}S.confirmAct=false;setPatch({active:b.dataset.key});}
 else if(a==='tplrm'){const t=clone(tpls[editKey()]),p=t.people[S.tplP],h=b.dataset.h;const arr=(p.slots[h]||[]).filter(x=>x!==b.dataset.t);p.slots[h]=arr;tplPatch(t,{people:{[S.tplP]:{slots:{[h]:arr}}}});}
 else if(a==='deluser'){
  if(S.confirmDel!==pk){S.confirmDel=pk;render(true);return;}
  const key=editKey(),t=clone(tpls[key]);delete t.people[pk];t.order=(t.order||[]).filter(x=>x!==pk);S.confirmDel='';S.tplP='';tpls[key]=t;if(key===activeKey())template=t;render(true);
  enqueue('tpl-'+key,()=>db.doc('config/'+key).set(t));
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.drawer||S.pop)){S.drawer=null;S.pop='';render(true);}});
document.addEventListener('change',e=>{
 const el=e.target,a=el.dataset&&el.dataset.act;if(!a)return;
 if(a==='me'){S.me=el.value;lsSet('rec.me',el.value);render(true);}
 else if(a==='date'){if(!el.value)return;S.date=el.value;S.dateTouched=true;if(db)subDay();render(true);}
 else if(a==='n'){saveItem(el.dataset.pk,el.dataset.k,{n:el.value===''?'':Math.max(0,Number(el.value))});}
 else if(a==='note'){saveItem(el.dataset.pk,el.dataset.k,{note:el.value.slice(0,500)});S.drawerMsg='';}
 else if(a==='tz'){setPatch({tz:el.value});}
 else if(a==='tplp'){S.tplP=el.value;S.confirmDel='';render(true);}
 else if(a==='tpls'||a==='tple'){const f=a==='tpls'?'start':'end',t=clone(tpls[editKey()]);t.people[S.tplP][f]=+el.value;tplPatch(t,{people:{[S.tplP]:{[f]:+el.value}}});}
 else if(a==='tpladd'){if(!el.value)return;const t=clone(tpls[editKey()]),p=t.people[S.tplP],h=el.dataset.h;p.slots=p.slots||{};const arr=[...(p.slots[h]||[]),el.value];p.slots[h]=arr;tplPatch(t,{people:{[S.tplP]:{slots:{[h]:arr}}}});}
});
document.addEventListener('submit',e=>{
 const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
 const d=Object.fromEntries(new FormData(f));
 if(f.dataset.form==='extra'){const pk=S.me,ex=[...((day[pk]&&day[pk].extra)||[])];if(!ex.some(x=>x.h==d.h&&x.t===d.t))ex.push({h:+d.h,t:d.t});saveExtra(pk,ex);}
 else if(f.dataset.form==='adduser'){
  const name=d.name.trim(),k=slug(name);if(!k)return;
  if(P(k,tpls[editKey()])){err='Ya existe alguien con ese nombre.';render(true);return;}
  const t=clone(tpls[editKey()]),st=+d.start,en=Math.max(+d.start,+d.end);t.people[k]={name,start:st,end:en,slots:{}};t.order=[...(t.order||[]),k];S.tplP=k;
  tplPatch(t,{people:{[k]:{name,start:st,end:en,slots:{}}},order:t.order});
 }
 else if(f.dataset.form==='addtask'){
  const id=slug(d.n);if(!id)return;if(catalog.tasks[id]){err='Esa tarea ya existe.';render(true);return;}
  const task={n:d.n.trim(),ab:d.ab.trim().toUpperCase(),cat:d.cat,desc:d.desc.trim(),link:safeUrl(d.link.trim())};
  const c=clone(catalog);c.tasks[id]=task;c.order=[...(c.order||[]),id];catalog=c;render(true);
  enqueue('cat',()=>db.doc('config/catalog').update({tasks:{[id]:task},order:c.order}));
 }
});
/* arrastrar y soltar en kanban */
let dragK='';
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(c){dragK=c.dataset.drag;try{e.dataTransfer.setData('text/plain',dragK)}catch(x){}}});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(c&&dragK){e.preventDefault();c.classList.add('over');}});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(c)c.classList.remove('over');});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(c&&dragK){e.preventDefault();const k=dragK;dragK='';setStatus(S.me,k,c.dataset.drop);}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(pending)render()},0));
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS.includes(v)){S.view=v;S.pop='';render(true);}});
setInterval(()=>render(),60000);

/* ---------- arranque ---------- */
render(true);
(async()=>{
 if(!window.claude||!window.claude.use){noDb=true;render(true);return;}
 const timer=setTimeout(()=>{if(!loadedTpl){err='Los datos todavía no cargan. Revisá tu conexión.';render(true);}},10000);
 let user;[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
 if(!db){clearTimeout(timer);noDb=true;render(true);return;}
 if(user){
  try{myId=await user.id()}catch(e){}
  try{canEdit=!!(await user.canEdit())}catch(e){}
  try{const cw=await user.can('data.write');if(cw===false)canWrite=false;}catch(e){}
 }
 db.doc('config/catalog').onSnapshot(s=>{catalog=s.exists?s.data():null;render();},()=>{});
 db.doc('config/template').onSnapshot(s=>{
  const prevTz=tz();tpls.template=s.exists?s.data():null;template=tpls[activeKey()];
  if(!s.metadata.fromCache||template){loadedTpl=true;clearTimeout(timer);if(err.startsWith('Los datos'))err='';}
  if(tz()!==prevTz&&!S.dateTouched){S.date=nowTZ().date;subDay();}
  render();
 },()=>{loadedTpl=true;clearTimeout(timer);err='No se pudo leer la plantilla.';render(true);});
 db.doc('config/propuesta').onSnapshot(s=>{tpls.propuesta=s.exists?s.data():null;template=tpls[activeKey()];render();},()=>{});
 db.doc('config/settings').onSnapshot(s=>{const prevTz=tz();settings=s.exists?{...s.data(),__ex:true}:null;template=tpls[activeKey()];if(tz()!==prevTz&&!S.dateTouched){S.date=nowTZ().date;subDay();}render();},()=>{});
 subDay();
})();
}
</script>
</body>
